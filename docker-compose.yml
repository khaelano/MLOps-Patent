services:
  mlflow-server:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    command:
      - mlflow
      - server
      - --backend-store-uri=${MLFLOW_BACKEND_STORE_URI}
      - --default-artifact-root=${MLFLOW_ARTIFACT_ROOT}
      - --host=0.0.0.0
      - --port=5000
      - --allowed-hosts=*
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - MLFLOW_S3_ENDPOINT_URL=${MLFLOW_S3_ENDPOINT_URL:-}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - patent-net
    restart: unless-stopped

  inference-server:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    deploy:
      replicas: 3
    environment:
      - HF_HOME=/app/.cache
    volumes:
      - embedder-cache:/app/.cache
    restart: unless-stopped
    networks:
      - patent-net

  # ── Nginx load-balancer in front of inference-server replicas ──────────
  inference-lb:
    image: nginx:stable-alpine
    ports:
      - "${INFERENCE_PORT:-8000}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro,Z
    restart: unless-stopped
    networks:
      - patent-net

  # ── Prometheus metrics scraper ───────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.8.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - patent-net

  # ── Grafana dashboard ────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:12.4.3
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro,Z
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro,Z
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - patent-net
    depends_on:
      - prometheus

volumes:
  embedder-cache:
  prometheus-data:
  grafana-data:

networks:
  patent-net:
    driver: bridge
