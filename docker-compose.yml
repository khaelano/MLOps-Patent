services:
  mlflow-server:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    command:
      - mlflow
      - server
      - --backend-store-uri=${MLFLOW_BACKEND_STORE_URI}
      - --default-artifact-root=${MLFLOW_ARTIFACT_ROOT}
      - --host=0.0.0.0
      - --port=5000
      - --allowed-hosts=*
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - MLFLOW_S3_ENDPOINT_URL=${MLFLOW_S3_ENDPOINT_URL:-}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - patent-net
    restart: unless-stopped

  inference-server:
    image: ghcr.io/khaelano/mlops-patent:latest
    # ── Inline entrypoint: monkey-patch MLflow's scoring server to bind 0.0.0.0 ──
    # MLflow 3.11.1 container _serve() does not pass --host to uvicorn, so
    # uvicorn defaults to 127.0.0.1 and the container is unreachable from
    # outside.  This wrapper patches scoring_server.get_cmd to inject the host.
    entrypoint:
      - python
      - -c
      - |
        from mlflow.models import container as C
        from mlflow.pyfunc import scoring_server

        _orig_get_cmd = scoring_server.get_cmd

        def _patched_get_cmd(*args, **kwargs):
            kwargs.setdefault("host", "0.0.0.0")
            return _orig_get_cmd(*args, **kwargs)

        scoring_server.get_cmd = _patched_get_cmd
        C._serve("local")
    deploy:
      replicas: 3
    environment:
      - DISABLE_NGINX=true
      - HF_HOME=/app/.cache/huggingface
    volumes:
      - embedder-cache:/app/.cache
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ping')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 300s
    restart: unless-stopped
    networks:
      - patent-net

  # ── Nginx load-balancer in front of inference-server replicas ──────────
  inference-lb:
    image: nginx:stable-alpine
    ports:
      - "${INFERENCE_PORT:-8000}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro,Z
    restart: unless-stopped
    networks:
      - patent-net

  # ── Monitoring stack ────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.55.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - ./config/prometheus/drift-alerts.yml:/etc/prometheus/drift-alerts.yml:ro,Z
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - patent-net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,Z
      - alertmanager-data:/alertmanager
    restart: unless-stopped
    networks:
      - patent-net

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro,Z
    restart: unless-stopped
    networks:
      - patent-net

  drift-webhook-bridge:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    entrypoint:
      - python
      - /app/config/alertmanager/webhook_bridge.py
    ports:
      - "${BRIDGE_PORT:-9099}:9099"
    environment:
      - BRIDGE_HOST=0.0.0.0
      - BRIDGE_PORT=9099
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
    volumes:
      - ./config/alertmanager/webhook_bridge.py:/app/config/alertmanager/webhook_bridge.py:ro,Z
      - ./.env:/app/.env:ro
    restart: unless-stopped
    networks:
      - patent-net

volumes:
  embedder-cache:
  prometheus-data:
  alertmanager-data:
  grafana-data:

networks:
  patent-net:
    driver: bridge
