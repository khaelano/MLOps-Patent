services:
  mlflow-server:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    command:
      - mlflow
      - server
      - --backend-store-uri=${MLFLOW_BACKEND_STORE_URI}
      - --default-artifact-root=${MLFLOW_ARTIFACT_ROOT}
      - --host=0.0.0.0
      - --port=5000
      - --allowed-hosts=*
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - MLFLOW_S3_ENDPOINT_URL=${MLFLOW_S3_ENDPOINT_URL:-}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - patent-net
    restart: unless-stopped

  # ── Inference server — MLflow pyfunc image, FastAPI entrypoint ──────────
  # The pyfunc image built via `mlflow models build-docker` already contains
  # the patent package, all dependencies, and the model files.  We override
  # the entrypoint to run *our* FastAPI app instead of MLflow's scoring_server
  # so that /health, /predict, AND /metrics are all available from one service.
  inference-server:
    image: ghcr.io/khaelano/mlops-patent:latest
    entrypoint:
      - python
      - -m
      - uvicorn
      - patent.api:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
    deploy:
      replicas: 3
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
      - MLFLOW_MODEL_NAME=${MLFLOW_MODEL_NAME:-patent-lshiforest}
      - EMBEDDER_SPEC=${EMBEDDER_SPEC:-embed-anything-onnx:AllMiniLML6V2Q}
      - DRIFT_SCORE_BUFFER_SIZE=10000
      - HF_HOME=/app/.cache/huggingface
    volumes:
      - embedder-cache:/app/.cache
    depends_on:
      mlflow-server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - patent-net

  # ── Nginx load-balancer in front of inference-server replicas ──────────
  inference-lb:
    image: nginx:stable-alpine
    ports:
      - "${INFERENCE_PORT:-8000}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro,Z
    restart: unless-stopped
    networks:
      - patent-net

  # ── Prometheus — scrapes /metrics from inference-lb ────────────────────
  prometheus:
    image: prom/prometheus:v3.7.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - patent-net
    restart: unless-stopped

  # ── Grafana — dashboards and alerting for drift monitoring ──────────────
  grafana:
    image: grafana/grafana:11.1.0
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_ALERTING_ENABLED=true
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro,Z
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - patent-net
    restart: unless-stopped

volumes:
  embedder-cache:
  prometheus-data:
  grafana-data:

networks:
  patent-net:
    driver: bridge
