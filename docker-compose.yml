services:
  mlflow-server:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    command:
      - mlflow
      - server
      - --backend-store-uri=${MLFLOW_BACKEND_STORE_URI}
      - --default-artifact-root=${MLFLOW_ARTIFACT_ROOT}
      - --host=0.0.0.0
      - --port=5000
      - --allowed-hosts=*
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - MLFLOW_S3_ENDPOINT_URL=${MLFLOW_S3_ENDPOINT_URL:-}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - patent-net
    restart: unless-stopped

  inference-server:
    image: ghcr.io/khaelano/mlops-patent:latest
    ports:
      - "${INFERENCE_PORT:-8000}:8000"
    environment:
      - DISABLE_NGINX=true
      - MLFLOW_MODELS_HOST=0.0.0.0
      - HF_HOME=/app/.cache/huggingface
    volumes:
      - embedder-cache:/app/.cache
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ping')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - patent-net

volumes:
  embedder-cache:

networks:
  patent-net:
    driver: bridge
