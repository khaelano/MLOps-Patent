services:
  mlflow-server:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    command:
      - mlflow
      - server
      - --backend-store-uri=${MLFLOW_BACKEND_STORE_URI}
      - --default-artifact-root=${MLFLOW_ARTIFACT_ROOT}
      - --host=0.0.0.0
      - --port=5000
      - --allowed-hosts=*
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - MLFLOW_S3_ENDPOINT_URL=${MLFLOW_S3_ENDPOINT_URL:-}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - patent-net
    restart: unless-stopped

  inference-server:
    image: ghcr.io/khaelano/mlops-patent:latest
    # ── Inline entrypoint: monkey-patch MLflow's scoring server to bind 0.0.0.0 ──
    # MLflow 3.11.1 container _serve() does not pass --host to uvicorn, so
    # uvicorn defaults to 127.0.0.1 and the container is unreachable from
    # outside.  This wrapper patches scoring_server.get_cmd to inject the host.
    entrypoint:
      - python
      - -c
      - |
        from mlflow.models import container as C
        from mlflow.pyfunc import scoring_server

        _orig_get_cmd = scoring_server.get_cmd

        def _patched_get_cmd(*args, **kwargs):
            kwargs.setdefault("host", "0.0.0.0")
            return _orig_get_cmd(*args, **kwargs)

        scoring_server.get_cmd = _patched_get_cmd
        C._serve("local")
    deploy:
      replicas: 3
    environment:
      - DISABLE_NGINX=true
      - HF_HOME=/app/.cache/huggingface
    volumes:
      - embedder-cache:/app/.cache
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ping')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 300s
    restart: unless-stopped
    networks:
      - patent-net

  # ── Nginx load-balancer in front of inference-server replicas ──────────
  inference-lb:
    image: nginx:stable-alpine
    ports:
      - "${INFERENCE_PORT:-8000}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro,Z
    restart: unless-stopped
    networks:
      - patent-net

volumes:
  embedder-cache:

networks:
  patent-net:
    driver: bridge
