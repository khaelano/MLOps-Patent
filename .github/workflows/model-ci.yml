name: Model CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  packages: write

concurrency:
  group: model-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── PR only: train, evaluate, register, promote ──────────────────────────
  train-evaluate-register:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/_train-evaluate-register.yml
    secrets: inherit
    with:
      pr-number: ${{ github.event.pull_request.number }}

  # ── PR comment (always runs after train-eval-reg, even on failure) ───────
  comment-pr:
    needs: [train-evaluate-register]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Download registration log
        uses: actions/download-artifact@v4
        with:
          name: register-output-${{ github.run_id }}
          path: .
        continue-on-error: true

      - name: Comment PR with results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let body = '## 🤖 Model CI Results\n\n';

            const trainResult = '${{ needs.train-evaluate-register.result }}';
            const runId = '${{ needs.train-evaluate-register.outputs.run_id }}';

            if (runId && trainResult === 'success') {
              body += `**MLflow Run**: \`${runId}\`\n`;
            } else if (trainResult === 'failure') {
              body += '**Status**: ❌ Training or evaluation failed\n\n';
            } else {
              body += '**Status**: ⚠️ Training skipped or cancelled\n\n';
            }

            let registerOutput = '';
            try {
              registerOutput = fs.readFileSync('.register-output.log', 'utf8');
            } catch (_) { /* file may not exist */ }

            if (registerOutput) {
              const promoted = registerOutput.includes('Promoted');
              const registered = registerOutput.includes('Registered');
              if (promoted) {
                body += '**Registry**: ✅ Registered & promoted to **Production**\n';
              } else if (registered) {
                body += '**Registry**: 📦 Registered (not promoted — metrics did not improve)\n';
              }
              const lines = registerOutput.split('\n').filter(l =>
                l.includes('Registered') ||
                l.includes('Promoted') ||
                l.includes('Archived') ||
                l.includes('improves') ||
                l.includes('does NOT')
              );
              if (lines.length) {
                body += '\n<details><summary>Registration details</summary>\n\n```\n';
                body += lines.join('\n');
                body += '\n```\n</details>\n';
              }
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.startsWith('## 🤖 Model CI Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ── Push to main only: build Docker image from Production model ──────────
  docker-release:
    if: github.event_name == 'push'
    uses: ./.github/workflows/_docker-build-push.yml
    secrets: inherit
