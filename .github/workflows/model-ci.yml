name: Model CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: model-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Always run tests ───────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python
      - uses: ./.github/actions/run-tests

  # ── Detect which paths changed ──────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      patent: ${{ steps.filter.outputs.patent }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            patent:
              - 'patent/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'pipelines/**'
              - 'dvc.yaml'

  # ── Retrain only when model code changed ───────────────────────────────
  train-evaluate-register:
    needs: [test, changes]
    if: needs.changes.outputs.patent == 'true'
    uses: ./.github/workflows/_train-evaluate-register.yml
    secrets: inherit
    with:
      experiment-name: "ci-code-change"

  # ── PR: dry-run Docker build (validates Dockerfile, no push) ───────────
  build-pr:
    needs: [test, changes, train-evaluate-register]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/_docker-build-push.yml
    secrets: inherit
    with:
      push: false

  # ── Push to main: build and publish Docker image ───────────────────────
  docker-release:
    needs: [test, changes, train-evaluate-register]
    if: |
      always() &&
      github.event_name == 'push' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/_docker-build-push.yml
    secrets: inherit
    with:
      push: true

  # ── PR comment with training + build summary ───────────────────────────
  comment-pr:
    needs: [train-evaluate-register, build-pr]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Download registration log
        uses: actions/download-artifact@v4
        with:
          name: register-output-${{ github.run_id }}
          path: .
        continue-on-error: true

      - name: Comment PR with results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let body = '## 🤖 Model CI Results\n\n';

            const trainResult = '${{ needs.train-evaluate-register.result }}';
            const buildResult = '${{ needs.build-pr.result }}';
            const runId = '${{ needs.train-evaluate-register.outputs.run_id }}';
            const codeChanged = '${{ needs.changes.outputs.patent }}';

            // ── Training section ──
            if (codeChanged === 'true') {
              if (runId && trainResult === 'success') {
                body += `**Training**: ✅ Retrained (code change) — MLflow run \`${runId}\`\n`;
              } else if (trainResult === 'failure') {
                body += '**Training**: ❌ Failed\n\n';
              } else if (trainResult === 'skipped') {
                body += '**Training**: ⏭️ Skipped\n';
              }
            } else {
              body += '**Training**: ⏭️ Skipped (no model code changes)\n';
            }

            // ── Registry section ──
            let registerOutput = '';
            try {
              registerOutput = fs.readFileSync('.register-output.log', 'utf8');
            } catch (_) { /* file may not exist */ }

            if (registerOutput) {
              const promoted = registerOutput.includes('Promoted');
              const registered = registerOutput.includes('Registered');
              if (promoted) {
                body += '**Registry**: ✅ Registered & promoted to **Production**\n';
              } else if (registered) {
                body += '**Registry**: 📦 Registered (not promoted — metrics did not improve)\n';
              }
              const lines = registerOutput.split('\n').filter(l =>
                l.includes('Registered') ||
                l.includes('Promoted') ||
                l.includes('Archived') ||
                l.includes('improves') ||
                l.includes('does NOT')
              );
              if (lines.length) {
                body += '\n<details><summary>Registration details</summary>\n\n```\n';
                body += lines.join('\n');
                body += '\n```\n</details>\n';
              }
            }

            // ── Build section ──
            if (buildResult === 'success') {
              body += '**Docker build**: ✅ Passed\n';
            } else if (buildResult === 'failure') {
              body += '**Docker build**: ❌ Failed\n';
            } else {
              body += '**Docker build**: ⏭️ Skipped\n';
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.startsWith('## 🤖 Model CI Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
