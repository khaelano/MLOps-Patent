name: "Continuous Training"

on:
  # ── Weekly schedule (Monday 02:00 UTC) ──────────────────────────────────
  schedule:
    - cron: "0 2 * * 1"

  # ── Manual trigger ─────────────────────────────────────────────────────
  workflow_dispatch:

  # ── Triggered by Grafana alert (data drift detection) ───────────────────
  repository_dispatch:
    types:
      - drift-detected

permissions:
  contents: write
  packages: write

concurrency:
  group: continuous-training
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Step 1: Fetch new data from arXiv OAI-PMH
  # ──────────────────────────────────────────────────────────────────────────
  data-update:
    runs-on: ubuntu-latest
    environment: Patent Model & Dataset Storage
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python

      - uses: ./.github/actions/dvc-pull
        with:
          aws-access-key-id: ${{ secrets.DVC_S3_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.DVC_S3_SECRET_KEY }}
          aws-endpoint-url: ${{ secrets.DVC_S3_ENDPOINT }}

      - name: Fetch arXiv OAI-PMH updates
        shell: bash
        run: |
          uv run python patent/cli.py data update

      - name: Push updated raw data to DVC remote
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DVC_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DVC_S3_SECRET_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.DVC_S3_ENDPOINT }}
          DVC_S3_ENDPOINTURL: ${{ secrets.DVC_S3_ENDPOINT }}
        run: |
          uv run dvc add data/raw/
          uv run dvc push --verbose

  # ──────────────────────────────────────────────────────────────────────────
  # Step 2: Process new data (reserialize → clean → embed) ONLY for new data
  # ──────────────────────────────────────────────────────────────────────────
  data-process:
    needs: data-update
    runs-on: ubuntu-latest
    environment: Patent Model & Dataset Storage
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python

      - name: Restore HuggingFace model cache
        uses: actions/cache@v4
        with:
          path: .hf_cache
          key: hf-embedder-cache-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            hf-embedder-cache-${{ runner.os }}-

      - uses: ./.github/actions/dvc-pull
        with:
          aws-access-key-id: ${{ secrets.DVC_S3_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.DVC_S3_SECRET_KEY }}
          aws-endpoint-url: ${{ secrets.DVC_S3_ENDPOINT }}

      - name: Process only new data (reserialize → clean → embed)
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Process only sources that don't yet have processed outputs
          uv run python patent/cli.py pipeline --skip-init

      - name: Push processed data to DVC remote
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DVC_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DVC_S3_SECRET_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.DVC_S3_ENDPOINT }}
          DVC_S3_ENDPOINTURL: ${{ secrets.DVC_S3_ENDPOINT }}
        run: |
          uv run dvc add data/interim/ data/processed/
          uv run dvc push --verbose

  # ──────────────────────────────────────────────────────────────────────────
  # Step 3: Train, evaluate, and promote model if metrics improve
  # ──────────────────────────────────────────────────────────────────────────
  train-evaluate-register:
    needs: data-process
    uses: ./.github/workflows/_train-evaluate-register.yml
    secrets: inherit
    with:
      experiment-name: "continuous-training"

  # ──────────────────────────────────────────────────────────────────────────
  # Step 4: Build and push Docker image from the Production model
  # ──────────────────────────────────────────────────────────────────────────
  docker-release:
    needs: train-evaluate-register
    uses: ./.github/workflows/_docker-build-push.yml
    secrets: inherit

  # ──────────────────────────────────────────────────────────────────────────
  # Step 5: Save new drift baseline (run after model deployment)
  # ──────────────────────────────────────────────────────────────────────────
  save-drift-baseline:
    needs: docker-release
    runs-on: ubuntu-latest
    environment: Patent Model & Dataset Storage
    timeout-minutes: 60

    env:
      MLFLOW_TRACKING_URI: http://127.0.0.1:5000

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python

      - uses: ./.github/actions/dvc-pull
        with:
          aws-access-key-id: ${{ secrets.DVC_S3_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.DVC_S3_SECRET_KEY }}
          aws-endpoint-url: ${{ secrets.DVC_S3_ENDPOINT }}
          targets: data/processed/

      - uses: ./.github/actions/start-mlflow
        with:
          aws-access-key-id: ${{ secrets.MLFLOW_S3_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.MLFLOW_S3_SECRET_KEY }}
          aws-endpoint-url: ${{ secrets.MLFLOW_S3_ENDPOINT }}
          mlflow-db-uri: ${{ secrets.MLFLOW_DB_URI }}
          mlflow-s3-bucket: ${{ secrets.MLFLOW_S3_BUCKET }}

      - name: Recompute and save drift baseline
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MLFLOW_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MLFLOW_S3_SECRET_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.MLFLOW_S3_ENDPOINT }}
          MLFLOW_MODEL_NAME: patent-lshiforest
        run: |
          uv run python -c "
          import numpy as np
          from mlflow.tracking import MlflowClient
          from patent.lshiforest import LSHiForest
          from patent.config import PROCESSED_DATA_DIR
          from patent.monitoring import save_drift_baseline
          from patent.utils import convert_parquet_to_memmap, load_parquet_metadata
          from patent.config import project_tempdir
          import shutil

          # Load Production model
          client = MlflowClient()
          prod = client.get_latest_versions('patent-lshiforest', stages=['Production'])[0]
          run_id = prod.run_id

          import mlflow, os
          from tempfile import TemporaryDirectory
          with TemporaryDirectory() as tmpdir:
              local = mlflow.artifacts.download_artifacts(
                  artifact_uri=f'runs:/{run_id}/model.lshif', dst_path=tmpdir
              )
              model = LSHiForest.load(str(local))

          # Load embeddings
          pq_paths = sorted(PROCESSED_DATA_DIR.glob('*.parquet'))
          tmp = project_tempdir()
          try:
              mmap_path = tmp / 'embeddings.mmap'
              dim, rows = convert_parquet_to_memmap(
                  [str(p) for p in pq_paths], str(mmap_path)
              )
              embeddings = np.memmap(
                  str(mmap_path), dtype=np.float32, mode='r', shape=(rows, dim)
              )

              # Score everything
              scores = model.score_chunked(embeddings, rows)

              # Save as new drift baseline
              emb_copy = np.array(embeddings[:10000], dtype=np.float32)
              score_copy = np.array(scores[:10000], dtype=np.float64)
              save_drift_baseline(emb_copy, score_copy, str(prod.version))
          finally:
              shutil.rmtree(tmp, ignore_errors=True)
          "

      - name: Push drift baseline to DVC
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DVC_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DVC_S3_SECRET_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.DVC_S3_ENDPOINT }}
          DVC_S3_ENDPOINTURL: ${{ secrets.DVC_S3_ENDPOINT }}
        run: |
          uv run dvc add data/interim/drift_baseline/
          uv run dvc push --verbose

      - uses: ./.github/actions/stop-mlflow
