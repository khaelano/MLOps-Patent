name: Update Image on Model Changes

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: 'MLflow model version to use (e.g., "1", "2"). Leave empty for Production stage.'
        required: false
        default: ''
      rebuild_image:
        description: 'Rebuild and push image after model update'
        required: false
        default: 'true'
  schedule:
    # Check for new Production models daily at 3 AM UTC
    - cron: '0 3 * * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check-model:
    runs-on: ubuntu-latest
    outputs:
      model_version: ${{ steps.check.outputs.version }}
      model_updated: ${{ steps.check.outputs.updated }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install mlflow==3.11.1

      - name: Check MLflow for new Production model
        id: check
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_BACKEND_STORE_URI: ${{ secrets.MLFLOW_BACKEND_STORE_URI }}
          MLFLOW_ARTIFACT_ROOT: ${{ secrets.MLFLOW_ARTIFACT_ROOT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MLFLOW_S3_ENDPOINT_URL: ${{ secrets.MLFLOW_S3_ENDPOINT_URL }}
        run: |
          python << 'EOF'
          import mlflow
          from pathlib import Path
          import json
          
          client = mlflow.tracking.MlflowClient()
          
          # Get registered model
          try:
              model = client.get_registered_model("patent-lshiforest")
              
              # Get latest Production version
              prod_versions = [v for v in model.latest_versions 
                              if v.current_stage == "Production"]
              
              if prod_versions:
                  latest = prod_versions[0]
                  version = latest.version
                  print(f"Found Production model version: {version}")
                  
                  # Store version for next job
                  with open("model_info.json", "w") as f:
                      json.dump({
                          "version": version,
                          "uri": latest.source,
                          "status": latest.status
                      }, f)
                  
                  # Check if version differs from current
                  if Path(".model_version").exists():
                      with open(".model_version", "r") as f:
                          current = f.read().strip()
                      print(f"Current version: {current}")
                      
                      if current != version:
                          print(f"::set-output name=updated::true")
                          print(f"::set-output name=version::{version}")
                      else:
                          print(f"::set-output name=updated::false")
                          print(f"::set-output name=version::{version}")
                  else:
                      print(f"::set-output name=updated::true")
                      print(f"::set-output name=version::{version}")
              else:
                  print("No Production model found")
                  print(f"::set-output name=updated::false")
          except Exception as e:
              print(f"Error checking MLflow: {e}")
              print(f"::set-output name=updated::false")
          EOF

      - name: Upload model info
        if: steps.check.outputs.updated == 'true'
        uses: actions/upload-artifact@v3
        with:
          name: model-info
          path: model_info.json

  rebuild:
    needs: check-model
    runs-on: ubuntu-latest
    if: |
      needs.check-model.outputs.model_updated == 'true' ||
      github.event.inputs.rebuild_image == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: tag
        run: |
          if [ -z "${{ github.event.inputs.model_version }}" ]; then
            TAG="production-$(date +%s)"
          else
            TAG="model-v${{ github.event.inputs.model_version }}-$(date +%s)"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Image will be tagged: $TAG"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}
            type=raw,value=latest-production,enable=true

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.description=Patent novelty detection inference server
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create deployment tag
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/docker-${{ steps.tag.outputs.tag }}',
              sha: context.sha
            }).catch(err => {
              console.log('Tag may already exist:', err.message);
            });

  notify:
    needs: [check-model, rebuild]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summarize results
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "- Model Updated: ${{ needs.check-model.outputs.model_updated }}" >> $GITHUB_STEP_SUMMARY
          echo "- Model Version: ${{ needs.check-model.outputs.model_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Image Rebuilt: ${{ needs.rebuild.result == 'success' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Registry: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
