name: "Data Update (Reusable)"

on:
  workflow_call:
    inputs:
      from-date:
        description: "Start date for OAI-PMH fetch (YYYY-MM-DD). Defaults to day after last update."
        required: false
        type: string
        default: ""
      to-date:
        description: "End date for OAI-PMH fetch (YYYY-MM-DD). Defaults to today."
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      from-date:
        description: "Start date for OAI-PMH fetch (YYYY-MM-DD)"
        required: false
        type: string
      to-date:
        description: "End date for OAI-PMH fetch (YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  data-update:
    runs-on: ubuntu-latest
    environment: Patent Model & Dataset Storage
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python

      - uses: ./.github/actions/dvc-pull
        with:
          aws-access-key-id: ${{ secrets.DVC_S3_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.DVC_S3_SECRET_KEY }}
          aws-endpoint-url: ${{ secrets.DVC_S3_ENDPOINT }}

      - name: Fetch arXiv OAI-PMH updates
        shell: bash
        run: |
          FROM_ARG=""
          TO_ARG=""
          if [ -n "${{ inputs.from-date }}" ]; then
            FROM_ARG="--from-date ${{ inputs.from-date }}"
          fi
          if [ -n "${{ inputs.to-date }}" ]; then
            TO_ARG="--to-date ${{ inputs.to-date }}"
          fi
          uv run python patent/cli.py data update ${FROM_ARG} ${TO_ARG}

      - name: DVC Add, Git Commit, and Push
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DVC_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DVC_S3_SECRET_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.DVC_S3_ENDPOINT }}
          DVC_S3_ENDPOINTURL: ${{ secrets.DVC_S3_ENDPOINT }}
        run: |
          # 1. Track new/changed data with DVC (generates/updates .dvc files)
          uv run dvc add data/raw/

          # 2. Configure Git identity
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 3. Stage all changes
          git add .

          # 4. Commit and push only if there are actual changes
          if ! git diff-index --quiet HEAD --; then
            # [skip ci] prevents this commit from triggering the workflow again
            git commit -m "chore: update dataset via OAI-PMH [skip ci]"
            git push origin ${{ github.ref_name }}
          else
            echo "No changes to commit."
          fi

          # 5. Push the actual data blobs to the DVC remote
          uv run dvc push --verbose
