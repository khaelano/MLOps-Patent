name: "Docker Build & Push (Reusable)"

on:
  workflow_call:
    inputs:
      push:
        type: boolean
        default: true
        description: "Push the built image to GHCR (false = dry-run build only)"
  workflow_dispatch:

jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    environment: Patent Model & Dataset Storage
    timeout-minutes: 60

    env:
      MLFLOW_TRACKING_URI: http://127.0.0.1:5000

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python

      - uses: ./.github/actions/start-mlflow
        with:
          aws-access-key-id: ${{ secrets.MLFLOW_S3_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.MLFLOW_S3_SECRET_KEY }}
          aws-endpoint-url: ${{ secrets.MLFLOW_S3_ENDPOINT }}
          mlflow-db-uri: ${{ secrets.MLFLOW_DB_URI }}
          mlflow-s3-bucket: ${{ secrets.MLFLOW_S3_BUCKET }}

      - name: Download model + baseline from MLflow
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MLFLOW_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MLFLOW_S3_SECRET_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.MLFLOW_S3_ENDPOINT }}
        run: |
          uv run python docker/app/download_model.py \
            --model-name patent-lshiforest \
            --version Production \
            --output-dir model

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          docker build \
            -f docker/app/Dockerfile \
            --build-arg MODEL_SOURCE=./model \
            --secret id=hf_token,env=HF_TOKEN \
            -t "ghcr.io/${{ github.repository_owner }}/mlops-patent:model-v$(cat model/model_version.txt)" \
            -t "ghcr.io/${{ github.repository_owner }}/mlops-patent:latest" \
            .

      - name: Push Docker image
        if: inputs.push
        run: |
          docker push "ghcr.io/${{ github.repository_owner }}/mlops-patent:model-v$(cat model/model_version.txt)"
          docker push "ghcr.io/${{ github.repository_owner }}/mlops-patent:latest"

      - uses: ./.github/actions/stop-mlflow