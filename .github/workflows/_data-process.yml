name: "Data Process (Reusable)"

on:
  workflow_call:
    inputs:
      force:
        description: "Force re-run steps even if outputs exist"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      force:
        description: "Force re-run steps even if outputs exist"
        required: false
        type: boolean
        default: false

jobs:
  data-process:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python

      - name: Restore HuggingFace model cache
        uses: actions/cache@v4
        with:
          path: .hf_cache
          key: hf-embedder-cache-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            hf-embedder-cache-${{ runner.os }}-

      - uses: ./.github/actions/dvc-pull
        with:
          aws-access-key-id: ${{ secrets.DVC_S3_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.DVC_S3_SECRET_KEY }}
          aws-endpoint-url: ${{ secrets.DVC_S3_ENDPOINT }}

      - name: Run data pipeline (reserialize → clean → embed)
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          FORCE_ARG=""
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE_ARG="--force"
          fi
          uv run python patent/cli.py pipeline --skip-init ${FORCE_ARG}

      - name: Push processed data to DVC remote
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DVC_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DVC_S3_SECRET_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.DVC_S3_ENDPOINT }}
          DVC_S3_ENDPOINTURL: ${{ secrets.DVC_S3_ENDPOINT }}
        run: |
          uv run dvc add data/interim/ data/processed/
          uv run dvc push --verbose
