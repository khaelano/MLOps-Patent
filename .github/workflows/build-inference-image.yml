name: Build & Push Inference Server Image

on:
  push:
    branches:
      - main
    paths:
      - 'docker/app/Dockerfile'
      - 'docker/app/**'
      - 'patent/**'
      - 'pyproject.toml'
      - '.github/workflows/build-inference-image.yml'
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push image to GHCR'
        required: false
        default: 'true'
  schedule:
    # Daily rebuild at 2 AM UTC to catch dependency updates
    - cron: '0 2 * * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/app/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Image digest
        run: echo "Image pushed with tags ${{ steps.meta.outputs.tags }}"

  verify:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and verify image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          docker pull "$IMAGE"
          
          # Verify endpoints are accessible
          docker run -d \
            --name test-container \
            -p 8000:8000 \
            --health-cmd="curl -f http://localhost:8000/health || exit 1" \
            --health-interval=15s \
            --health-timeout=10s \
            --health-retries=5 \
            --health-start-period=120s \
            "$IMAGE" \
            --host 0.0.0.0 \
            --port 8000 \
            2>&1 || true
          
          # Give container time to start
          sleep 5
          
          # Check health
          if docker ps --filter "name=test-container" --filter "status=running" | grep -q test-container; then
            echo "✅ Container started successfully"
          else
            echo "⚠️ Container did not start (expected in CI - requires MLflow connection)"
            docker logs test-container || true
          fi
          
          docker rm -f test-container 2>/dev/null || true
