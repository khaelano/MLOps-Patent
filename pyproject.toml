[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "patent"
version = "0.0.1"
description = "A paper novelty assessor based on anomaly detection"
authors = [
  { name = "Khaelano Abroor Maulana" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "boto3>=1.38.1",
    "dvc[s3]>=3.67.1",
    "embed-anything>=0.7.0",
    "fastapi>=0.115.0",
    "kaggle>=1.7.4.5",
    "loguru",
    "mlflow>=3.11.1",
    "numpy",
    "prometheus-client>=0.21.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "pandas",
    "psycopg2-binary>=2.9.12",
    "pyarrow>=23.0.1",
    "python-dotenv",
    "requests>=2.33.1",
    "tqdm",
    "typer",
    "uvicorn[standard]>=0.34.0",
    "zstandard>=0.23.0",
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["patent"]
include = ["pyproject.toml", "patent/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["patent"]
force-sort-within-sections = true

[dependency-groups]
dev = [
    "memory-profiler>=0.61.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "ty>=0.0.35",
]
