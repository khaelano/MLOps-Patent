# Grafana alert rule: Data Drift Detected
#
# Triggers when the inference server's consensus drift detector
# (≥2-of-4 signals: KS test, Wasserstein distance, mean shift,
# energy distance) flags sustained drift for 5 minutes.
#
# Wired to a GitHub repository_dispatch contact point that triggers
# the continuous-training workflow.

apiVersion: 1

groups:
  - orgId: 1
    name: patent_drift_alerts
    folder: "Alerts"
    interval: 1m
    rules:
      - uid: patent_drift_detected
        title: "Data Drift Detected"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prometheus"
            model:
              expr: 'patent_drift_detected{service="patent-inference"}'
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Data drift detected by consensus detector"
          description: |
            The inference server's drift detector has flagged a sustained
            distribution shift.  KS p-value and mean shift metrics contain
            the detailed diagnostics.

            This will trigger the continuous-training workflow.
        labels:
          severity: warning
          drift_type: score_distribution
        isPaused: false
