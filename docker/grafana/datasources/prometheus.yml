# ── Grafana datasource provisioning ───────────────────────────────────────
# Auto-configures the Prometheus datasource so Grafana can query metrics out
# of the box without manual UI setup.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "15s"
