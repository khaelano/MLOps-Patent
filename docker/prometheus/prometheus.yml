global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"
      scheme: http
      timeout: 10s

rule_files:
  - "/etc/prometheus/alerting_rules.yml"

scrape_configs:
  - job_name: "inference-server"
    metrics_path: "/metrics"
    dns_sd_configs:
      - names:
          - "inference-server"
        type: "A"
        port: 8000
        refresh_interval: 30s

  - job_name: "prometheus"
    static_configs:
      - targets:
          - "prometheus:9090"

  - job_name: "alertmanager"
    static_configs:
      - targets:
          - "alertmanager:9093"
