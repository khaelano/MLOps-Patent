user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Docker's internal DNS resolver
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    access_log /dev/stdout;

    upstream inference_backend {
        # Use Docker's internal DNS — each replica gets its own IP.
        # Nginx resolves the name on every request when used with
        # "server" + "resolve" in a location block, or at startup
        # when used in a plain upstream block.
        # We use the plain upstream block for stable connection pools
        # combined with nginx's built-in passive health checks.
        server inference-server:8000 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;
        server_name _;

        # Health check for Docker compose
        location /health {
            access_log off;
            return 200 "OK";
        }

        # Proxy all traffic to the inference backend
        location / {
            proxy_pass http://inference_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 10s;

            # Disable buffering for streaming responses
            proxy_buffering off;
        }
    }
}
