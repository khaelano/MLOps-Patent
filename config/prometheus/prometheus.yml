# ──────────────────────────────────────────────────────────────────────────────
# Prometheus configuration — scrapes the inference server and evaluates
# drift alert rules.
# ──────────────────────────────────────────────────────────────────────────────

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "drift-alerts.yml"

scrape_configs:
  - job_name: "patent-inference"
    metrics_path: "/drift"
    static_configs:
      - targets: ["inference-lb:80"]
    scrape_interval: 30s

  - job_name: "patent-inference-http"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["inference-lb:80"]
    scrape_interval: 30s
